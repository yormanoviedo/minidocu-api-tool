# Memoria MiniDocuAPITool

## Descripción
Herramienta web ligera para documentar interfaces de APIs, inspirada en el look-and-feel de Swagger.

## Funcionalidades
- Organización por proyectos (agrupación de iFlows)
- Gestión visual con visualización de payloads (request/response)
- Persistencia en localStorage del navegador
- Exportación/Importación de base de datos (.txt)
- Generación de documentación Word (.doc)

## Tecnologías
- Frontend: HTML único (58KB), sin dependencias complejas
- Almacenamiento: localStorage API
- UI: Estilo Swagger/OpenAPI
- Exportación: Generación de documentos Word (.doc)

## Estructura
```
minidocu-api-tool/
├── minidocu-api-tool.html (58KB - app principal)
├── entities.json (estructura BD)
├── mempalace.yaml (configuración)
├── memoria.yaml (este archivo - MEMORIA)
├── README.md
└── .gitignore
```

## localStorage
- Proyectos
- APIs/Endpoints
- Payloads (request/response)

## Características
- Sin instalación (solo HTML)
- Persistencia en navegador
- Backup/restore
- Exportación profesional a Word

